name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # IMPORTANT: CocoaPods setup
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      # IMPORTANT: clean and install pods properly
      - name: Install iOS Pods
        run: |
          cd ios
          pod repo update
          pod install

      - name: Clean build
        run: flutter clean

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
